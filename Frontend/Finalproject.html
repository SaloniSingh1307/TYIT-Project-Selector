<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Submit Project</title>
    <link rel="stylesheet" href="Register.css">
</head>

<body>

<div class="register-container">

    <h2>Submit Your Project Proposals</h2>

    <p id="message" style="color:red; font-weight:bold;"></p>

    <form id="projectForm">

        <h4>Project Proposal 1</h4>
        <input type="text" id="title1" placeholder="Title" required>
        <input type="text" id="desc1" placeholder="Description" required>

        <h4>Project Proposal 2</h4>
        <input type="text" id="title2" placeholder="Title" required>
        <input type="text" id="desc2" placeholder="Description" required>

        <h4>Project Proposal 3</h4>
        <input type="text" id="title3" placeholder="Title" required>
        <input type="text" id="desc3" placeholder="Description" required>

        <label>
            <input type="checkbox" id="agreement" required>
            I agree that one of the submitted projects may be selected as my final year project.
        </label>

        <br><br>
        <button type="submit">Submit</button>

    </form>
</div>

<script src="FinalProject.js"></script>
</body>
</html>
